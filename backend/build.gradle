plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.5.1'      // SBOM(CycloneDX) 생성 — 보안점검 B-13
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web MVC (SseEmitter로 FE에 SSE 중계) — Boot 4에서 starter-web → starter-webmvc
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // WebClient (Backend → AI /internal/* 호출, SSE 수신) — 서버는 Tomcat 유지
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DB: MariaDB + Flyway (Boot 4는 starter-flyway가 있어야 자동 실행)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // JWT (A 파트)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 업로드 파일 매직넘버(MIME) 검사 (B 파트 FileValidator)
    implementation 'org.apache.tika:tika-core:3.2.2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 — Boot 4는 모듈별 테스트 스타터 (@WebMvcTest, @DataJpaTest 등)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// F의 Dockerfile에서 COPY하기 쉽게 jar 이름 고정
bootJar {
    archiveFileName = 'app.jar'
}
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}