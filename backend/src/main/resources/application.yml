# application.yml (A 소유 — 비밀값과 환경별 주소는 모두 환경변수로 주입)
server:
  port: 8080

spring:
  application:
    name: baton-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/baton_db}
    username: ${SPRING_DATASOURCE_USERNAME:baton_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마 변경은 Flyway 마이그레이션으로만 관리
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET_KEY:}                              # 코드/설정 파일에 값을 직접 쓰지 않는다 (32바이트 이상)
  access-expiration: ${JWT_ACCESS_EXPIRATION_MS:1800000}    # Access Token: 30분 (1,800,000ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # Refresh Token: 7일 (604,800,000ms, DB SHA-256 해시 저장)

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}          # Compose 내부망: http://ai-module:8000
  internal-api-key: ${AI_INTERNAL_API_KEY:}               # X-Internal-Api-Key 헤더 값
  timeout-ms: ${AI_TIMEOUT_MS:30000}                      # 연결 3초 / 첫 토큰 30초 / 수집·전체 스트림 120초

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:health}              # 최소 권한 원칙: health만 노출
  endpoint:
    health:
      show-details: never

