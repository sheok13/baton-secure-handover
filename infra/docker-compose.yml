services:
  database:
    image: mariadb:11.2
    container_name: baton-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: baton_db
      MARIADB_USER: baton_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - baton-net

  ai-module:
    build:
      context: ../ai-module
    image: ${DOCKERHUB_USERNAME}/baton-ai:${IMAGE_TAG:-latest}
    container_name: baton-ai
    # 최소 권한: .env 전체(env_file) 대신 AI 모듈이 읽는 변수만 주입 (보안점검 I-1-06)
    # DB 비밀번호·JWT 서명키는 전달하지 않는다
    environment:
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      VECTOR_STORE_PATH: ${VECTOR_STORE_PATH}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD}
    expose:
      - "8000"
    volumes:
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - baton-net

  backend:
    build:
      context: ../backend
    image: ${DOCKERHUB_USERNAME}/baton-backend:${IMAGE_TAG:-latest}
    container_name: baton-backend
    # 최소 권한: .env 전체(env_file) 대신 백엔드가 읽는 변수만 주입 (보안점검 I-1-06)
    # LLM API 키·DB root 비밀번호는 전달하지 않는다
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/baton_db
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      AI_BASE_URL: http://ai-module:8000
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ACTUATOR_EXPOSURE: ${ACTUATOR_EXPOSURE:-health}
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
      ai-module:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - baton-net

  frontend:
    build:
      context: ../frontend
    image: ${DOCKERHUB_USERNAME}/baton-frontend:${IMAGE_TAG:-latest}
    container_name: baton-frontend
    # 프론트엔드가 직접 80포트를 쓰던 것을 nginx로 넘기기 위해 ports를 제거하고 expose로 변경
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - baton-net

  nginx:
    # root 없이 동작하는 공식 nginx 이미지 (uid 101) — 보안점검 I-2-04
    image: nginxinc/nginx-unprivileged:alpine
    container_name: baton-nginx
    ports:
      - "80:8080"            # 외부 80 → 컨테이너 8080 (일반 사용자는 80번 직접 사용 불가)
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - baton-net

volumes:
  db-data:
  chroma_data:

networks:
  baton-net:
    driver: bridge