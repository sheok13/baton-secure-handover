services:
  database:
    image: mariadb:11.2
    container_name: baton-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: baton_db
      MARIADB_USER: baton_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - baton-net

  ai-module:
    build:
      context: ../ai-module
    image: ${DOCKERHUB_USERNAME}/baton-ai:${IMAGE_TAG:-latest}
    container_name: baton-ai
    env_file: ../.env
    expose:
      - "8000"
    volumes:
      - chroma_data:/data/chroma
    restart: unless-stopped
    networks:
      - baton-net

  backend:
    build:
      context: ../backend
    image: ${DOCKERHUB_USERNAME}/baton-backend:${IMAGE_TAG:-latest}
    container_name: baton-backend
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/baton_db
      AI_BASE_URL: http://ai-module:8000
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
      ai-module:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - baton-net

  frontend:
    build:
      context: ../frontend
    image: ${DOCKERHUB_USERNAME}/baton-frontend:${IMAGE_TAG:-latest}
    container_name: baton-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - baton-net

volumes:
  db-data:
  chroma_data:

networks:
  baton-net:
    driver: bridge
