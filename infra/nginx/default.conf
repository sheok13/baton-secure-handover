server {
    listen 8080;            # unprivileged 이미지: 컨테이너 안에서는 8080 (외부는 compose가 80으로 연결)
    server_tokens off;      # 응답 헤더의 nginx 버전 숨김

    # 프론트엔드 라우팅
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 백엔드 API 라우팅
    location /api/ {
        client_max_body_size 10m;              # 업로드 최대 10MB (백엔드 multipart 제한과 동일)
        proxy_pass http://backend:8080;

        # 프록시 기본 헤더
        # nginx가 최앞단이므로 클라이언트가 보낸 X-Forwarded-For를 이어 붙이지 않고 실제 접속 IP로 덮어쓴다
        # (SecurityConfig.getClientIp()가 첫 번째 값을 감사 로그 IP로 사용 → 위조 방지)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # SSE 스트리밍: HTTP/1.1 keep-alive 유지
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE: 버퍼링·캐시를 꺼서 token을 받는 즉시 전달
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 기본 60초 끊김 방지 (백엔드 스트림 최대 120초 + 여유)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}