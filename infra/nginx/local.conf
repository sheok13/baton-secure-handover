server {
    listen 80;

    # 프론트엔드 라우팅
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 백엔드 API 라우팅 (default.conf와 동일한 업로드·SSE 설정)
    location /api/ {
        client_max_body_size 10m;              # 업로드 최대 10MB (백엔드 multipart 제한과 동일)
        proxy_pass http://backend:8080;

        # 프록시 기본 헤더 (감사 로그의 클라이언트 IP 기록용)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 스트리밍: HTTP/1.1 keep-alive 유지
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE: 버퍼링·캐시를 꺼서 token을 받는 즉시 전달 (한꺼번에 나오는 문제 해결)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 기본 60초에 끊기는 문제 방지 (백엔드 스트림 최대 120초 + 여유)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}