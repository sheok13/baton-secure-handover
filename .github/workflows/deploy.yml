name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ] # 배포를 트리거할 브랜치
  workflow_dispatch: # 수동 실행 옵션

jobs:
  # 1. Gitleaks 전체 이력 스캔
  security-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 전체 히스토리를 가져와 스캔

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. FE, BE, AI 이미지 빌드 및 푸시
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: security-scan # Gitleaks 스캔 통과 시에만 실행
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17 (Backend 빌드용)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      # 테스트 실패 시 여기서 중단 → 이미지가 빌드·푸시되지 않음
      # 단위 테스트는 Mock 기반이라 DB 없이 실행된다 (BatonApplicationTests는 @Disabled)
      - name: Run Backend Tests
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew test

      - name: Upload Test Report (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

      - name: Build Backend JAR
        run: |
          cd backend
          ./gradlew clean build -x test   # 테스트는 위 단계에서 이미 통과

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/baton-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/baton-frontend:latest

      - name: Build and push AI Module Image
        uses: docker/build-push-action@v4
        with:
          context: ./ai-module
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/baton-ai:latest