name: CI Build & Push
on:
  push:
    branches: [ "main", "develop" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: baton/backend:latest
      - name: Build AI Module Image
        uses: docker/build-push-action@v4
        with:
          context: ./ai-module
          push: false
          tags: baton/ai-module:latest
